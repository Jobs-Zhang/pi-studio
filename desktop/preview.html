<!DOCTYPE html>
<html>
<head>
  <title>Icon Preview</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: system-ui; padding: 40px; }
    .grid { display: flex; gap: 40px; flex-wrap: wrap; }
    .icon { text-align: center; }
    .icon img { width: 128px; height: 128px; border-radius: 24px; }
    .icon p { margin-top: 12px; font-size: 14px; color: #8b949e; }
    h1 { margin-bottom: 32px; }
  </style>
</head>
<body>
  <h1>Icon Options</h1>
  <div class="grid">
    <div class="icon"><img src="icon-v1.png"><p>v1 - Pill shape</p></div>
    <div class="icon"><img src="icon-v2.png"><p>v2 - Terminal cursor</p></div>
    <div class="icon"><img src="icon-v3.png"><p>v3 - Circle ring</p></div>
    <div class="icon"><img src="icon-v4.png"><p>v4 - Rounded square</p></div>
    <div class="icon"><img src="icon-v5.png"><p>v5 - Play button</p></div>
  </div>
</body>
</html>
