<!DOCTYPE html>
<html>
<head>
  <title>PI Icon Preview</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: system-ui; padding: 40px; }
    .grid { display: flex; gap: 40px; flex-wrap: wrap; }
    .icon { text-align: center; }
    .icon img { width: 128px; height: 128px; border-radius: 24px; border: 2px solid #21262d; }
    .icon p { margin-top: 12px; font-size: 14px; color: #8b949e; }
    h1 { margin-bottom: 32px; }
  </style>
</head>
<body>
  <h1>PI Icon Options</h1>
  <div class="grid">
    <div class="icon"><img src="icon-pi-1.png"><p>1 - PI 文字</p></div>
    <div class="icon"><img src="icon-pi-2.png"><p>2 - π 符号</p></div>
    <div class="icon"><img src="icon-pi-3.png"><p>3 - 蓝底白字</p></div>
    <div class="icon"><img src="icon-pi-4.png"><p>4 - 双色 PI</p></div>
    <div class="icon"><img src="icon-pi-5.png"><p>5 - 几何 P+I</p></div>
    <div class="icon"><img src="icon-pi-6.png"><p>6 - 连笔 PI</p></div>
  </div>
</body>
</html>
