<!DOCTYPE html>
<html>
<head>
  <title>PI Desktop Icon</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: system-ui; padding: 40px; }
    .grid { display: flex; gap: 40px; flex-wrap: wrap; }
    .icon { text-align: center; cursor: pointer; }
    .icon img { width: 128px; height: 128px; border-radius: 24px; border: 3px solid transparent; transition: all 0.2s; }
    .icon:hover img { border-color: #58a6ff; transform: scale(1.05); }
    .icon p { margin-top: 12px; font-size: 14px; color: #8b949e; }
    h1 { margin-bottom: 32px; }
  </style>
</head>
<body>
  <h1>Choose PI Desktop Icon</h1>
  <div class="grid">
    <div class="icon"><img src="icon-final-1.png"><p>1 - 纯白</p></div>
    <div class="icon"><img src="icon-final-2.png"><p>2 - 绿色</p></div>
    <div class="icon"><img src="icon-final-3.png"><p>3 - 紫色</p></div>
    <div class="icon"><img src="icon-final-4.png"><p>4 - 红色</p></div>
    <div class="icon"><img src="icon-final-5.png"><p>5 - 蓝色渐变</p></div>
  </div>
</body>
</html>
