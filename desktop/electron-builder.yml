appId: dev.pi.studio.desktop
productName: PI Studio
# Single config source for electron-builder (the npm scripts pass --config);
# keep the runtime file allowlist here so tests and preview pages never ship.
files:
  - main.cjs
  - preload.cjs
  - connect.html
  - sshConfig.cjs
  - tunnel.cjs
  - history.cjs
  - icon.png
  - icon.ico
extraResources:
  - from: ../LICENSE
    to: LICENSE
win:
  # Only code signing is skipped; resource editing must stay enabled or the
  # exe keeps Electron's default icon and version metadata.
  signExecutable: false
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
# Installed builds only: the NSIS installer creates Start Menu/Desktop
# shortcuts carrying the AppUserModelID, which Windows requires before toast
# notifications can show. The portable target registers no shortcut, so toasts
# from a portable exe are silently dropped.
nsis:
  artifactName: PI Studio Setup.exe
